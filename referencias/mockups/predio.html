<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Predio — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --amarillo:#F5C518; --amarillo-osc:#C99500; --crema:#FFF6D5;
    --rojo:#D7263D; --verde:#2E8B3A; --hud1:#2F6FB5; --hud2:#1B3F73;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0f2238;overflow:hidden;font-family:Nunito,Tahoma,sans-serif}
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;overflow:hidden;
    background:linear-gradient(#7cc4f2 0%,#bfe6ff 38%,#d9f0d0 60%,#9ccf7a 100%)}
  svg#scene{position:absolute;inset:0}
  .titulo{font-family:'Lilita One',sans-serif;color:#fff;letter-spacing:.5px;
    text-shadow:-2px -2px 0 #2a1a00,2px -2px 0 #2a1a00,-2px 2px 0 #2a1a00,2px 2px 0 #2a1a00,0 4px 0 #2a1a00}
  /* HUD */
  .hud{position:absolute;top:12px;left:14px;right:14px;display:flex;gap:10px;align-items:stretch}
  .pan{background:linear-gradient(var(--hud1),var(--hud2));border:3px solid #fff;border-radius:14px;
    box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35);color:#fff;padding:6px 12px;display:flex;align-items:center;gap:10px}
  .club{min-width:360px}
  .club .nombre{font-family:'Lilita One';font-size:22px;line-height:1;text-shadow:0 2px 0 #0b2140}
  .estrellas{color:#FFD43B;font-size:15px;letter-spacing:1px;text-shadow:0 1px 0 #7a5a00}
  .nivel{display:flex;align-items:center;gap:6px;margin-top:3px}
  .barra{width:150px;height:14px;border-radius:8px;background:#0b2140;border:2px solid #fff;overflow:hidden}
  .barra i{display:block;height:100%;width:62%;background:linear-gradient(#9cf06b,#3fae2a)}
  .nv{font-family:'Lilita One';background:var(--amarillo);color:#3a2800;border:2px solid #fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 0 #7a5a00}
  .monto{font-family:'Lilita One';font-size:22px;text-shadow:0 2px 0 #0b2140}
  .ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .mas{font-family:'Lilita One';background:linear-gradient(#7ee35a,#2f9a1f);border:2px solid #fff;border-radius:8px;width:26px;height:26px;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 0 #1a5c10}
  .esp{flex:1}
  .badge{position:absolute;top:-8px;right:-8px;background:var(--rojo);color:#fff;font-family:'Lilita One';font-size:14px;border:2px solid #fff;border-radius:12px;padding:0 6px}
  /* abajo */
  .play{position:absolute;left:22px;bottom:22px;width:138px;height:138px;border-radius:50%;
    background:radial-gradient(circle at 50% 35%,#4a4a4a,#111 70%);border:6px solid var(--amarillo);
    box-shadow:0 6px 0 #6b4f00,0 10px 20px rgba(0,0,0,.4),inset 0 -8px 0 rgba(0,0,0,.4);display:grid;place-items:center}
  .play span{font-size:40px}
  .play::after{content:"";position:absolute;left:18px;right:18px;top:10px;height:46px;border-radius:50%;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0))}
  .play b{position:absolute;bottom:-14px;font-family:'Lilita One';font-size:30px;color:#fff;
    text-shadow:-2px -2px 0 #2a1a00,2px -2px 0 #2a1a00,-2px 2px 0 #2a1a00,2px 2px 0 #2a1a00,0 4px 0 #2a1a00}
  .nav{position:absolute;left:190px;right:190px;bottom:16px;height:74px;border-radius:18px;border:4px solid #fff;
    background:linear-gradient(#ffe066,var(--amarillo) 55%,var(--amarillo-osc));box-shadow:0 6px 0 #7a5a00,0 12px 24px rgba(0,0,0,.35);
    display:flex;justify-content:space-around;align-items:center;padding:0 10px}
  .tab{display:flex;flex-direction:column;align-items:center;font-family:'Lilita One';color:#4a3200;font-size:17px;position:relative;padding:4px 14px;border-radius:12px}
  .tab .e{font-size:28px;line-height:1.1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
  .tab.on{background:rgba(255,255,255,.55);box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
  .tab .badge{right:2px;top:-6px}
  .diario{position:absolute;right:22px;bottom:22px;width:140px;height:110px;border-radius:14px;border:4px solid #fff;
    background:linear-gradient(#f4f1ea,#d9d2c3);box-shadow:0 6px 0 #6d6455,0 10px 20px rgba(0,0,0,.35);transform:rotate(3deg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Lilita One';color:#2b2b2b}
  .diario .t{font-size:20px}.diario .s{font-family:Nunito;font-weight:800;font-size:12px;color:#6b6b6b;text-align:center;padding:0 8px}
  /* tarjeta del despacho */
  .toast{position:absolute;left:14px;top:112px;width:320px;background:#fff;border-radius:16px;border:3px solid #fff;
    box-shadow:0 6px 0 rgba(0,0,0,.2),0 10px 24px rgba(0,0,0,.25);overflow:hidden}
  .toast .cab{background:linear-gradient(#ff5470,var(--rojo));color:#fff;font-family:'Lilita One';font-size:15px;padding:6px 12px;display:flex;justify-content:space-between}
  .toast .cue{display:flex;gap:10px;padding:10px 12px}
  .toast .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ffb36b,#e0732b);display:grid;place-items:center;font-size:24px;flex:none;border:2px solid #fff;box-shadow:0 0 0 2px #e0732b}
  .toast p{margin:0;font-weight:800;font-size:14px;color:#222;line-height:1.25}
  .toast small{color:#888;font-weight:700}
  .toast .bot{display:flex;gap:8px;padding:0 12px 12px}
  .btn{flex:1;text-align:center;font-family:'Lilita One';font-size:15px;color:#fff;border-radius:10px;padding:7px 0;border:2px solid rgba(0,0,0,.25);
    box-shadow:0 3px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 1px 0 rgba(0,0,0,.4)}
  .btn.v{background:linear-gradient(#7ee35a,#2f9a1f)}.btn.a{background:linear-gradient(#ffe066,#e0a800);color:#4a3200;text-shadow:none}
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1280 720"></svg>

  <div class="hud">
    <div class="pan club">
      <svg width="48" height="56" viewBox="0 0 48 56"><path d="M24 2 L44 9 V27 C44 41 34 50 24 54 C14 50 4 41 4 27 V9 Z" fill="#fff"/><path d="M24 6 L40 11.5 V27 C40 38.5 32 46 24 49.5 C16 46 8 38.5 8 27 V11.5 Z" fill="#D7263D"/><path d="M8 22 H40 V30 H8 Z" fill="#fff"/><text x="24" y="29" text-anchor="middle" font-family="Lilita One" font-size="9" fill="#D7263D">AVF</text><circle cx="24" cy="40" r="4" fill="#fff"/></svg>
      <div>
        <div class="nombre">Atlético Villa Ferro</div>
        <div class="estrellas">★★★☆☆ <span style="font-family:Nunito;font-size:12px;color:#cfe3ff;font-weight:800">B Nacional · 4.º</span></div>

  </div>

  <div class="play"><span>⚽</span><b>JUGAR</b></div>
  <div class="nav">
    <div class="tab on"><span class="e">🏟️</span>Predio</div>
    <div class="tab"><span class="e">📣</span>Despacho<span class="badge">3</span></div>
    <div class="tab"><span class="e">👥</span>Plantel</div>
    <div class="tab"><span class="e">📋</span>Táctica</div>
    <div class="tab"><span class="e">📅</span>Fixture</div>
    <div class="tab"><span class="e">⋯</span>Más</div>
  </div>
  <div class="diario"><div class="t">📰 EL DIARIO</div><div class="s">"El Loco" Bermúdez, libre: ¿lo traés?</div></div>
</div>

<script>
// ---------- utilidades isométricas ----------
const TW = 60, TH = 30, ZH = 28, CX = 565, CY = 150;
const svg = document.getElementById('scene');
const NS = 'http://www.w3.org/2000/svg';
const P = (x, y, z = 0) => [CX + (x - y) * TW / 2, CY + (x + y) * TH / 2 - z * ZH];
const pts = a => a.map(p => p.join(',')).join(' ');
function el(tag, attrs, parent = svg) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function shade(hex, amt) {
  let n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function poly(a, fill, extra = {}) { return el('polygon', Object.assign({ points: pts(a), fill, stroke: shade(fill, -0.35), 'stroke-width': .8, 'stroke-linejoin': 'round' }, extra)); }
function box(x, y, z, w, d, h, c, opt = {}) {
  const top = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)];
  const left = [P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)];
  const right = [P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)];
  poly(left, opt.left || c); poly(right, opt.right || shade(c, -0.22)); const t = poly(top, opt.top || shade(c, 0.22));
  if (opt.shine) el('polyline', { points: pts([P(x, y + d, z + h), P(x, y, z + h), P(x + w, y, z + h)]), fill: 'none', stroke: 'rgba(255,255,255,.55)', 'stroke-width': 1.5 });
  return t;
}
function sombra(x, y, w, d, op = .22) { const [sx, sy] = P(x + w / 2 + .25, y + d / 2 + .25); el('ellipse', { cx: sx, cy: sy, rx: (w + d) * TW / 4 + 6, ry: (w + d) * TH / 4 + 3, fill: `rgba(20,40,10,${op})` }); }
function techo(x, y, z, w, d, h, c) { // techo a dos aguas sobre eje x
  const m = y + d / 2;
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, m, z + h), P(x, m, z + h)], shade(c, .05));
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, m, z + h)], shade(c, -.25));
  poly([P(x, y, z), P(x + w, y, z), P(x + w, m, z + h), P(x, m, z + h)], shade(c, -.1));
}
function arbol(x, y, s = 1) {
  sombra(x - .2, y - .2, .5 * s, .5 * s, .25);
  const [bx, by] = P(x, y, 0);
  el('rect', { x: bx - 3 * s, y: by - 18 * s, width: 6 * s, height: 18 * s, rx: 2, fill: '#7a4b22' });
  el('circle', { cx: bx, cy: by - 30 * s, r: 17 * s, fill: '#2f8f2f' });
  el('circle', { cx: bx - 5 * s, cy: by - 35 * s, r: 10 * s, fill: '#4fb84a' });
  el('circle', { cx: bx - 8 * s, cy: by - 39 * s, r: 4 * s, fill: 'rgba(255,255,255,.35)' });
}
function texto(x, y, z, str, size, fill, ang = 'x', extra = {}) { // texto pegado a una cara
  const [sx, sy] = P(x, y, z); const m = ang === 'x' ? '1,0.5,0,1' : '1,-0.5,0,1';
  const t = el('text', Object.assign({ transform: `matrix(${m},${sx},${sy})`, 'font-family': 'Lilita One', 'font-size': size, fill, 'text-anchor': 'middle' }, extra)); t.textContent = str; return t;
}
function burbuja(x, y, z, str, color = '#F5C518', tcolor = '#3a2800') {
  const [sx, sy] = P(x, y, z); const w = str.length * 8.5 + 22;
  const g = el('g', {});
  el('path', { d: `M${sx - 7},${sy - 4} L${sx},${sy + 6} L${sx + 7},${sy - 4} Z`, fill: '#fff' }, g);
  el('rect', { x: sx - w / 2, y: sy - 30, width: w, height: 28, rx: 14, fill: '#fff' }, g);
  el('rect', { x: sx - w / 2 + 3, y: sy - 27, width: w - 6, height: 22, rx: 11, fill: color }, g);
  const t = el('text', { x: sx, y: sy - 11, 'text-anchor': 'middle', 'font-family': 'Lilita One', 'font-size': 15, fill: tcolor }, g); t.textContent = str;
}
function cartel(x, y, z, str) { // cartel de nombre bajo edificios
  const [sx, sy] = P(x, y, z); const w = str.length * 7.2 + 18;
  el('rect', { x: sx - w / 2, y: sy, width: w, height: 20, rx: 6, fill: 'rgba(16,40,70,.82)', stroke: '#fff', 'stroke-width': 1.5 });
  const t = el('text', { x: sx, y: sy + 14.5, 'text-anchor': 'middle', 'font-family': 'Nunito', 'font-weight': 900, 'font-size': 12, fill: '#fff' }); t.textContent = str;
}

// ---------- escena v2: estadio protagonista a la izquierda, villa a la derecha ----------
const ROJO = '#D7263D', BLANCO = '#f4f4f4';

// barrio de fondo (detrás de los bordes superiores)
const casas = [];
for (let i = -1; i < 20; i += 2.2) casas.push([i, -3.4]);
for (let i = 0; i < 15; i += 2.2) casas.push([-3.4, i]);
for (let i = 1; i < 20; i += 2.6) casas.push([i, -5.8]);
for (let i = 1; i < 15; i += 2.6) casas.push([-5.8, i]);
casas.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
const paredes = ['#f2e2c4', '#e9d1d1', '#d8e6f2', '#f6edc0', '#dfe9d2'];
casas.forEach(([x, y], i) => {
  const h = 1.1 + (i % 3) * .25, c = paredes[i % paredes.length];
  box(x, y, 0, 1.4, 1.4, h, c);
  techo(x - .05, y - .05, h, 1.5, 1.5, .6, i % 2 ? '#c4553a' : '#a8432f');
});
// cartel de sponsor en el barrio
box(12.2, -1.6, 0, .15, .15, 2.4, '#5b5b5b'); box(16.2, -1.6, 0, .15, .15, 2.4, '#5b5b5b');
box(11.9, -1.75, 2.2, 4.8, .2, 1.5, '#1d1d1d', { left: '#0f7a3c' });
texto(14.3, -1.53, 2.7, 'ApostAR', 26, '#fff'); texto(14.3, -1.53, 2.35, 'cada gol paga doble*', 11, '#c9ffd9');

// plataforma y césped
const GX = 19, GY = 14;
box(0, 0, -.6, GX, GY, .6, '#a0703f', { top: '#a0703f' });
for (let x = 0; x < GX; x++) for (let y = 0; y < GY; y++) poly([P(x, y), P(x + 1, y), P(x + 1, y + 1), P(x, y + 1)], (x + y) % 2 ? '#6cc24a' : '#5fb53f', { stroke: 'none' });
const piso = (x, y, w, d, c, s) => poly([P(x, y), P(x + w, y), P(x + w, y + d), P(x, y + d)], c, { stroke: s || shade(c, -.2) });

// ===== ESTADIO: terreno reservado completo =====
const SX = .6, SY = .6, SW = 9.2, SD = 12.8;          // terreno del estadio
piso(SX, SY, SW, SD, '#7fd05a', '#4f9a35');            // césped más claro y prolijo
for (let x = 0; x < SW; x += 1) for (let y = 0; y < SD; y += 1) if ((x + y) % 2) piso(SX + x, SY + y, 1, 1, '#88d763', 'none');
// borde: murito bajo de ladrillo alrededor del terreno
box(SX, SY, 0, SW, .18, .25, '#c96f4a'); box(SX, SY, 0, .18, SD, .25, '#c96f4a');
// estacas de obra futura (marcan dónde irán las tribunas)
const estaca = (x, y) => { box(x, y, 0, .08, .08, .7, '#e0a800'); const [sx, sy] = P(x, y, .7); el('path', { d: `M${sx},${sy} l12,-5 l0,8 z`, fill: '#ff7a00' }); };
for (let x = 1.4; x < 9.4; x += 2) { estaca(x, 1.5); estaca(x, 12.5); }
for (let y = 3.5; y < 12; y += 2) { estaca(1.4, y); estaca(9, y); }
el('polyline', { points: pts([P(1.45, 1.55, .35), P(9.05, 1.55, .35), P(9.05, 12.55, .35)]), stroke: '#ffcf33', 'stroke-width': 1.5, 'stroke-dasharray': '6 4', fill: 'none' });
el('polyline', { points: pts([P(1.45, 1.55, .35), P(1.45, 12.55, .35), P(9.05, 12.55, .35)]), stroke: '#ffcf33', 'stroke-width': 1.5, 'stroke-dasharray': '6 4', fill: 'none' });

// tablón del fondo (lado izquierdo de la cancha, x chico)
for (let i = 0; i < 2; i++) box(2.3 + i * .45, 4.4, 0, .45, 5.2, .7 - i * .35, '#c08a52', { shine: 1, top: '#d9a56b' });
// vestuario de chapa
box(3.5, 2.4, 0, 2, 1.2, 1, '#b9c4cf', { shine: 1 }); techo(3.4, 2.3, 1, 2.2, 1.4, .35, '#8a96a3');
box(4.1, 3.6, 0, .6, .02, .7, '#5b3a1e'); texto(4.5, 3.62, .82, 'VESTUARIO', 8, '#fff');
// la cancha (chica, cat. 1)
const CXa = 3.4, CYa = 4.4, CW = 4.4, CD = 6.6;
piso(CXa, CYa, CW, CD, '#3fa34d', '#2a7a37');
for (let s = 0; s < 6; s++) if (s % 2) piso(CXa, CYa + s * CD / 6, CW, CD / 6, '#4bb35a', 'none');
const L = { fill: 'none', stroke: '#fff', 'stroke-width': 1.6 };
el('polygon', Object.assign({ points: pts([P(CXa + .3, CYa + .3), P(CXa + CW - .3, CYa + .3), P(CXa + CW - .3, CYa + CD - .3), P(CXa + .3, CYa + CD - .3)]) }, L));
el('polyline', Object.assign({ points: pts([P(CXa + .3, CYa + CD / 2), P(CXa + CW - .3, CYa + CD / 2)]) }, L));
{ const [ex, ey] = P(CXa + CW / 2, CYa + CD / 2); el('ellipse', Object.assign({ cx: ex, cy: ey, rx: 34, ry: 17 }, L)); }
el('polygon', Object.assign({ points: pts([P(CXa + 1.4, CYa + .3), P(CXa + 3, CYa + .3), P(CXa + 3, CYa + 1.1), P(CXa + 1.4, CYa + 1.1)]) }, L));
el('polygon', Object.assign({ points: pts([P(CXa + 1.4, CYa + CD - .3), P(CXa + 3, CYa + CD - .3), P(CXa + 3, CYa + CD - 1.1), P(CXa + 1.4, CYa + CD - 1.1)]) }, L));
box(CXa + 1.8, CYa + .12, 0, .8, .14, .45, '#fff', { top: '#fff' });
box(CXa + 1.8, CYa + CD - .26, 0, .8, .14, .45, '#fff', { top: '#fff' });
[[4.4, 6.2, ROJO], [5.9, 7.4, ROJO], [4.9, 9.1, ROJO], [6.4, 9.8, '#2b5bd7'], [5.5, 5.4, '#2b5bd7']].forEach(([x, y, c]) => { const [sx, sy] = P(x, y); el('ellipse', { cx: sx, cy: sy + 2, rx: 5, ry: 2.5, fill: 'rgba(0,0,0,.25)' }); el('rect', { x: sx - 3, y: sy - 12, width: 6, height: 11, rx: 2, fill: c }); el('circle', { cx: sx, cy: sy - 15, r: 3.5, fill: '#e8b98a' }); });
{ const [sx, sy] = P(5.6, 7.7); el('circle', { cx: sx, cy: sy - 2, r: 2.6, fill: '#fff', stroke: '#333', 'stroke-width': .8 }); }
// alambrado alrededor de la cancha
const AL = [[CXa - .2, CYa - .2], [CXa + CW + .2, CYa - .2], [CXa + CW + .2, CYa + CD + .2], [CXa - .2, CYa + CD + .2]];
for (let k = 0; k < 4; k++) { const [a, b] = [AL[k], AL[(k + 1) % 4]]; const n = 8; for (let i = 0; i <= n; i++) { const x = a[0] + (b[0] - a[0]) * i / n, y = a[1] + (b[1] - a[1]) * i / n; const [p1, p2] = [P(x, y, 0), P(x, y, .8)]; el('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], stroke: '#8a8f99', 'stroke-width': 1.2 }); } el('polyline', { points: pts([P(a[0], a[1], .8), P(b[0], b[1], .8)]), stroke: '#a6abb4', 'stroke-width': 1.2, fill: 'none' }); el('polygon', { points: pts([P(a[0], a[1], 0), P(b[0], b[1], 0), P(b[0], b[1], .8), P(a[0], a[1], .8)]), fill: 'rgba(200,205,215,.12)', stroke: 'none' }); }
// tablón del frente (lado derecho de la cancha, x grande) — bajo para no tapar
for (let i = 0; i < 2; i++) box(8.05 + i * .45, 5.2, 0, .45, 5, .3 + i * .3, '#c08a52', { shine: 1, top: '#d9a56b' });
// hinchas en los tablones
for (let k = 0; k < 9; k++) { const [sx, sy] = P(8.55, 5.5 + k * .5, .62); el('circle', { cx: sx, cy: sy - 5, r: 3.2, fill: k % 3 ? ROJO : '#fff', stroke: 'rgba(0,0,0,.25)', 'stroke-width': .6 }); }
for (let k = 0; k < 9; k++) { const [sx, sy] = P(2.5, 4.8 + k * .55, .72); el('circle', { cx: sx, cy: sy - 5, r: 3.2, fill: k % 2 ? ROJO : '#fff', stroke: 'rgba(0,0,0,.25)', 'stroke-width': .6 }); }
// bandera y trapo
function bandera(x, y, c = ROJO) { box(x, y, 0, .06, .06, 2.2, '#ddd'); const [sx, sy] = P(x, y, 2.2); el('path', { d: `M${sx},${sy} q14,-6 28,0 v16 q-14,6 -28,0 z`, fill: c, stroke: '#fff', 'stroke-width': 1.2 }); }
bandera(2.1, 3.9); bandera(8.9, 11.6);
// árboles y bancos dentro del terreno (que se vea cuidado)
[[1.2, 11.6], [1.3, 2.1], [8.8, 2.1], [8.9, 12.9], [1.2, 6.8]].forEach(([x, y]) => arbol(x, y, .8));
[[6.3, 12.1], [3.6, 12.1]].forEach(([x, y]) => { box(x, y, 0, 1, .3, .25, '#9b6a3c', { top: '#b9824e' }); });

// ===== CALLE entre el estadio y la villa =====
piso(10, 0, 1.1, GY, '#7c7f87', '#5f626a');
for (let y = .4; y < GY; y += 1.4) piso(10.5, y, .1, .7, '#f4f4f4', 'none');

// ===== LA VILLA =====
const vereda = (x, y, w, d) => piso(x, y, w, d, '#e8d9b5', '#cbb88e');
vereda(11.1, 0, 7.9, .9); vereda(11.1, 4.6, 7.9, .8); vereda(11.1, 9.4, 7.9, .8); vereda(14.6, 0, .8, GY);

// oficinas (el Despacho) — arriba
sombra(11.5, 1.2, 2.2, 2.6);
box(11.5, 1.2, 0, 2.2, 2.6, 2.2, '#f1ece2', { shine: 1 });
box(11.4, 1.1, 2.2, 2.4, 2.8, .18, ROJO, { shine: 1 });
for (let f = 0; f < 2; f++) for (let c = 0; c < 2; c++) poly([P(11.8 + c * .95, 3.81, .45 + f * .95), P(12.4 + c * .95, 3.81, .45 + f * .95), P(12.4 + c * .95, 3.81, 1.0 + f * .95), P(11.8 + c * .95, 3.81, 1.0 + f * .95)], '#8fc8ff');
for (let f = 0; f < 2; f++) for (let r = 0; r < 2; r++) poly([P(13.71, 1.5 + r * 1.1, .45 + f * .95), P(13.71, 2.1 + r * 1.1, .45 + f * .95), P(13.71, 2.1 + r * 1.1, 1.0 + f * .95), P(13.71, 1.5 + r * 1.1, 1.0 + f * .95)], '#6fa9e0');
bandera(13.4, 1.4);
texto(12.6, 3.82, 1.95, "OFICINAS", 11, ROJO);

// prensa y redes
sombra(16.2, 2.6, 2.2, 2.2);
box(16.2, 2.6, 0, 2.2, 2.2, 1.8, '#3d4a5c', { shine: 1, top: '#56657a' });
box(17.6, 3, 1.8, .1, .1, 1.3, "#9aa3b1"); { const [sx, sy] = P(17.65, 3.05, 3.15); el('circle', { cx: sx, cy: sy, r: 4, fill: ROJO }); }
poly([P(16.35, 4.81, .35), P(18.25, 4.81, .35), P(18.25, 4.81, 1.55), P(16.35, 4.81, 1.55)], '#0e1622');
texto(17.3, 4.82, 1.1, '● EN VIVO', 12, '#ff4d6d'); texto(17.3, 4.82, .72, '12,4k viendo', 9, '#cfe3ff');

// cancha de entrenamiento
piso(11.4, 5.8, 2.8, 3.4, "#3fa34d", "#fff");
el("polyline", Object.assign({ points: pts([P(11.4, 7.5), P(14.2, 7.5)]) }, L));
box(12.4, 5.7, 0, .8, .12, .4, '#fff', { top: '#fff' }); box(12.4, 9.1, 0, .8, .12, .4, '#fff', { top: '#fff' });
[[11.9, 6.3], [13.8, 6.7], [12.3, 8.2], [13.9, 8.6]].forEach(([x, y]) => { const [sx, sy] = P(x, y); el('path', { d: `M${sx - 4},${sy} L${sx},${sy - 10} L${sx + 4},${sy} Z`, fill: '#ff7a00' }); });

// ojeadores
sombra(16.2, 7.2, 2, 1.8);
box(16.2, 7.2, 0, 2, 1.8, 1.1, '#e9d8b4', { shine: 1 }); techo(16.1, 7.1, 1.1, 2.2, 2, .6, '#2f6fb5');
box(16.8, 9.0, 0, .8, .02, .7, '#6b4a2a'); texto(17.2, 9.02, .85, '🔭', 16, '#000');

// parrilla
sombra(11.8, 10.5, 1.8, 1.4);
box(11.8, 10.5, 0, 1.8, 1.4, 1, '#f3c9a0', { shine: 1 }); techo(11.7, 10.4, 1, 2, 1.6, .5, '#2E8B3A');
box(12.1, 11.92, .45, 1.2, .02, .35, '#5b3a1e'); texto(12.7, 11.94, .58, 'PARRILLA', 9, '#ffd8a8');
box(13.35, 10.8, 1.2, .2, .2, .7, '#555');
for (let s = 0; s < 3; s++) { const [sx, sy] = P(13.45, 10.9, 2.1 + s * .45); el('circle', { cx: sx + s * 4, cy: sy, r: 6 + s * 2, fill: 'rgba(240,240,240,.75)' }); }

// lote bloqueado
function baldio(x, y, nv) {
  poly([P(x, y), P(x + 2.4, y), P(x + 2.4, y + 2.4), P(x, y + 2.4)], '#b98a52', { stroke: '#8a6236', 'stroke-dasharray': '4 3' });
  for (let i = 0; i < 4; i++) { const [sx, sy] = P(x + .5 + (i % 2) * 1.3, y + .5 + (i >> 1) * 1.2); el('circle', { cx: sx, cy: sy, r: 3, fill: '#9a7041' }); }
  box(x + 1.1, y + 1.1, 0, .12, .12, 1, '#6b4a2a');
  box(x + .7, y + 1.15, .75, .9, .06, .5, '#f1e3c3');
  texto(x + 1.15, y + 1.21, .9, '🔒 Nv ' + nv, 11, '#5b3d1e');
}
baldio(16, 10.8, 9);

// árboles de la villa
[[18.6, .6], [18.6, 4.8], [18.6, 9.2], [14.9, 12.9], [18.5, 13.4], [11.3, 13.2]].forEach(([x, y], i) => arbol(x, y, .85 + (i % 3) * .1));

// ===== carteles y burbujas =====
cartel(5.4, 13.3, 0, 'Estadio · Cancha de barrio · 1.800 personas');
burbuja(5.6, 7.6, 2.4, '⬆ Categoría 2: Estadio de ascenso');
cartel(12.6, 4.25, 0, 'Oficinas · el Despacho'); burbuja(12.6, 2.4, 3.1, '📣 3 situaciones', '#ff6b81', '#fff');
cartel(17.3, 5.2, 0, 'Prensa y redes · Nv 1');
cartel(12.8, 9.7, 0, 'Entrenamiento · Nv 3');
cartel(17.2, 9.4, 0, 'Ojeadores · Nv 2'); burbuja(17.2, 7.9, 2.2, '🚧 1 fecha', '#ffb020');
cartel(12.7, 12.3, 0, 'Parrilla · Nv 1');

// ---------- escala ----------
function fit() { const s = Math.min(innerWidth / 1280, innerHeight / 720); document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();
</script>
